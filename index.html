'자진모리':{cd:2.675/12,bpb:4,rows:{A:'D--K--K-TK--',B:'D--D--D-TK--',C:'D-TKT-K-TKT-'},secs:['A'.repeat(8),'B'.repeat(8),'C'.repeat(8),'BC'.repeat(4)]},
'세마치':{cd:1.938/9,bpb:3,rows:{A:'D--D-TKT-'},secs:['A'.repeat(16),'A'.repeat(16)]}};
const NM={D:'덩',K:'쿵',T:'덕',G:'기덕',R:'더러러러'},SIDES={D:['L','R'],K:['L'],T:['R'],G:['R'],R:['R']};
const SY={D:'<circle cx=18 cy=22 r=14 /><line x1=18 y1=8 x2=18 y2=36 />',K:'<circle cx=18 cy=22 r=14 />',T:'<line x1=18 y1=4 x2=18 y2=40 />',G:'<circle class=f cx=18 cy=6 r=3 /><line x1=18 y1=14 x2=18 y2=40 />',R:'<circle class=f cx=18 cy=8 r=2.6 /><circle class=f cx=18 cy=22 r=2.6 /><circle class=f cx=18 cy=36 r=2.6 />'};
const $=id=>document.getElementById(id);
let cur='굿거리',run=false,t0=0,cd=.4,cells=[],notes=[],score=0,combo=0,hits=0,ac,buf={},guide=true,ready=false,np=0,ng=0,nm=0,mc=0,paused=false;
const tabs=$('tabs');
Object.keys(SONGS).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{cur=k;start()};tabs.appendChild(b)});
function mark(){[...tabs.children].forEach(b=>b.classList.toggle('on',b.textContent==cur))}
async function loadAudio(){
 if(ready)return;ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume();
 for(const k in SMP){const s=atob(SMP[k]),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);
  buf[k]=await new Promise((r,j)=>ac.decodeAudioData(u.buffer,r,j))}
 ready=true}
function play(k,when,v=1){if(!ready)return;const s=ac.createBufferSource(),g=ac.createGain();s.buffer=buf[k];g.gain.value=v;s.connect(g).connect(ac.destination);s.start(Math.max(when||0,ac.currentTime))}
const KEY={D:'deong',K:'kung',T:'deok',G:'gideok',R:'deoreo'};
function build(){
 const S=SONGS[cur],st=$('strip');st.innerHTML='';cells=[];notes=[];cd=S.cd;
 const rl=S.rows.A.length;
 S.secs.forEach((sec,si)=>{
  for(let i=0;i<S.bpb*3;i++)cells.push({tok:'-',ci:1,beat:i%3==0?i/3+1:0,meta:'준비'});
  [...sec].forEach((r,ri)=>{const row=S.rows[r];
   for(let i=0;i<rl;i++)cells.push({tok:row[i],ci:0,meta:'구역 '+(si+1)+'/'+S.secs.length+' · '+(r.charCodeAt(0)-64)+'번 줄 · '+(ri+1)+'/'+sec.length+'회'})})});
 cells.forEach((c,i)=>{
  const d=document.createElement('div');d.className='c '+(c.tok=='-'?'':c.tok)+(c.ci?' ci':'')+(i%3==0?' g':'');
  d.innerHTML='<div class=bx>'+(c.ci?(c.beat?'<b>'+c.beat+'</b>':''):c.tok=='-'?'':'<svg viewBox="0 0 36 44">'+SY[c.tok]+'</svg>')+'</div><span>'+(c.tok=='-'?'':NM[c.tok])+'</span>';
  st.appendChild(d);c.el=d;
  if(c.tok!='-')SIDES[c.tok].forEach(s=>notes.push({t:i*cd,side:s,i,done:0}));
 });
}
async function start(){await loadAudio();ac.resume();build();t0=ac.currentTime+.6;score=combo=hits=np=ng=nm=mc=0;upd();paused=false;run=true;$('ov').style.display='none';mark();fb('','')}
function upd(){$('sc').textContent=score;$('cb').textContent=combo;$('np').textContent=np;$('ng').textContent=ng;$('nm').textContent=nm;const j=np+ng+nm;$('ac').textContent=(j?Math.round((np+ng)/j*100):0)+'%'}
function fb(t,c){const f=$('fb');f.textContent=t;f.style.color=c}
function tap(side){
 if(!ready||paused)return;
 const now=ac.currentTime-t0,tol=Math.max(.12,Math.min(.2,cd*.5));let best=null;
 if(run)for(const n of notes)if(n.side==side&&!n.done&&Math.abs(n.t-now)<tol&&(!best||Math.abs(n.t-now)<Math.abs(best.t-now)))best=n;
 $(side=='L'?'fL':'fR').style.opacity=1;
 if(!best){play(side=='L'?'kung':'deok',0,.9);if(run){combo=0;upd()}return}
 const c=cells[best.i],tk=c.tok;
 if(tk=='D'){if(!c.dp){c.dp=1;play('deong',0,1)}}else play(KEY[tk],0,1);
 const e=Math.abs(best.t-now),pf=e<tol*.45;best.done=pf?2:1;hits++;combo++;mc=Math.max(mc,combo);const gain=(pf?100:50)+Math.min(combo,20)*2;score+=gain;pf?np++:ng++;
 c.el.classList.add('hit');fb((pf?'완벽! +':'좋아요 +')+gain,'#2fa84f');upd()}
$('tL').addEventListener('pointerdown',e=>{e.preventDefault();tap('L')});
$('tR').addEventListener('pointerdown',e=>{e.preventDefault();tap('R')});
$('go').onclick=start;
$('bP').onclick=()=>{if(paused){ac.resume();paused=false}else if(!run)start()};
$('bU').onclick=()=>{if(run&&!paused){ac.suspend();paused=true;fb('일시정지','#c9b59f')}};
$('bS').onclick=()=>{if(!ready)return;ac.resume();paused=false;run=false;score=combo=hits=np=ng=nm=mc=0;build();upd();$('name').textContent=cur+' · 정지';fb('','');['fL','fR'].forEach(i=>$(i).style.opacity=0)};
$('gd').onclick=()=>{guide=!guide;$('gd').textContent='가이드 '+(guide?'ON':'OFF');$('gd').classList.toggle('on',guide)};
addEventListener('keydown',e=>{if(e.repeat)return;if(e.key=='f'||e.key=='ArrowLeft')tap('L');if(e.key=='j'||e.key=='ArrowRight')tap('R')});
mark();
function loop(){
 requestAnimationFrame(loop);
 if(!ready||!cells.length)return;
 const W=64,now=run?ac.currentTime-t0:-.6;
 $('strip').style.transform='translateX('+(62-W/2-(now/cd)*W)+'px)';
 if(!run)return;
 const idx=Math.max(0,Math.min(cells.length-1,Math.floor(now/cd+.5)));$('name').textContent=cur+' · '+cells[idx].meta;
 const tol=Math.max(.12,Math.min(.2,cd*.5)),a={L:0,R:0},nx={L:'',R:''};
 for(let i=Math.max(0,idx-1);i<Math.min(cells.length,idx+8);i++){
  const c=cells[i],T=i*cd;
  if(!c.sd&&T<now+.15){c.sd=1;
   if(c.ci&&c.beat)play('click',t0+T,.9);
   else if(guide&&c.tok!='-')play(KEY[c.tok],t0+T,.45)}}
 for(const n of notes){
  if(n.done)continue;const dt=n.t-now;
  if(dt<-tol){n.done=-1;combo=0;nm++;cells[n.i].el.classList.add('miss');fb('놓침','#d0584a');upd();continue}
  if(dt<1){const v=1-Math.max(dt,0)/1;if(v>a[n.side]){a[n.side]=v;nx[n.side]=NM[cells[n.i].tok]}}}
 for(const s of['L','R']){const f=$(s=='L'?'fL':'fR');f.style.opacity=Math.max(a[s]*.85,(+f.style.opacity||0)-.08);$('n'+s).textContent=a[s]>.3?nx[s]:''}
 if(now>cells.length*cd+.8){run=false;const pc=Math.round(hits/notes.length*100),ov=$('ov');ov.style.display='flex';
  ov.firstElementChild.innerHTML='<h2 style="margin:0 0 8px">'+cur+' 끝!</h2><p style="margin:0">점수 <b>'+score+'</b><br>최고 콤보 '+mc+' · 완벽 '+np+' · 좋아요 '+ng+' · 놓침 '+nm+'<br>정확도 '+pc+'% ('+(pc>=90?'명고수 🥁':pc>=70?'장단이 잡혔어요':'한 번 더!')+')</p><button id="go">다시 하기</button>';$('go').onclick=start}
}
loop();
</script></body></html>
